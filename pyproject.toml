[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finanzas-abiertas-cr"
version = "0.1.0"
description = "Descarga, normaliza y visualiza los datos financieros públicos de instituciones costarricenses, empezando por la Universidad Nacional (UNA)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.10"
authors = [{ name = "Jose Guadamuz Elizondo" }]
keywords = ["costa-rica", "datos-abiertos", "transparencia", "presupuesto-publico", "dash"]
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dashboard = ["dash>=2.14", "plotly>=5.18"]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4", "dash>=2.14", "plotly>=5.18", "scikit-learn>=1.3"]

[project.scripts]
finanzas = "finanzas_cr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
